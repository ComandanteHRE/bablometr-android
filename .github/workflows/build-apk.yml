name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bablometr-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bablometr.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Bablometr.apk --title "Bablometr APK" --notes "Latest debug build" --target "$GITHUB_SHA"
      - name: Copy APK to apk branch
        run: |
          mkdir /tmp/apkout && cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/Bablometr.apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan apk && git rm -rf . -q && cp /tmp/apkout/Bablometr.apk . && git add Bablometr.apk
          git commit -m "APK build $GITHUB_SHA" && git push -f origin apk
